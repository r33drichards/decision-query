# ClusterFuzzLite corpus pruning, which the docs require alongside batch fuzzing.
name: ClusterFuzzLite cron tasks
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions: read-all
jobs:
  Pruning:
    runs-on: ubuntu-latest
    steps:
      # build_fuzzers reads .clusterfuzzlite/project.yaml from the workspace to
      # pick the Ubuntu 24.04 images; without a checkout it falls back to 20.04,
      # whose glibc cannot run the fuzzers built on 24.04.
      - uses: actions/checkout@v4
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c++
      - name: Run Fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'prune'
          output-sarif: true
