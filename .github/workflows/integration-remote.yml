# Integration test against a remote System One endpoint over HTTPS.
#
# Sends the commands under test to that service, so it needs a repository
# secret. GitHub does not expose secrets to a pull request from a fork, and
# working around that with pull_request_target would run untrusted code with
# this repository's credentials. So on a fork this job reports success without
# testing anything, and says so in the log.
#
# The consequence is deliberate and worth stating plainly: a pull request from
# a fork can merge without the remote backend ever having been exercised.
# integration-local still runs in full on forks, since it needs no secret.
#
# A PR that touches no code (see the first step) skips the test and passes
# without the integration-test label, from a fork or not.
name: integration-remote
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: integration-remote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  remote-backend:
    name: remote-backend
    runs-on: ubuntu-latest
    steps:
      # A change that cannot affect the build (docs, Markdown, lint config,
      # other workflows) needs no integration test, so the check passes without
      # the label. Anything not listed counts as code, so a new kind of file is
      # tested until someone decides otherwise.
      - name: Check whether this PR touches code
        id: code
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          # The files API lists at most 3000 files; past that, assume code.
          if [ "$CHANGED" -ge 3000 ]; then
            echo "touches=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          touches=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/integration-*) touches=true; echo "Code change: $f" ;;
              *.md|docs/*|LICENSE|.gitignore|.clang-format|.clang-tidy) ;;
              .github/dependabot.yml|.github/workflows/*) ;;
              *) touches=true; echo "Code change: $f" ;;
            esac
          done <<< "$files"
          if [ "$touches" = false ]; then
            echo "::notice::No code changed, so the integration test was skipped. It runs, and needs the integration-test label, once a PR touches code."
          fi
          echo "touches=$touches" >> "$GITHUB_OUTPUT"
      # Before the label gate, so a fork is never blocked by it on a job that
      # cannot run for it anyway.
      - name: Check whether this PR can reach the secret
        id: gate
        run: |
          # Only a pull request can come from a fork. On a manual run the
          # pull_request context is empty, which would otherwise look like a
          # fork and silently skip the whole test.
          if [ "${{ steps.code.outputs.touches }}" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::notice::Pull request is from a fork, which GitHub does not give repository secrets. The remote backend was NOT tested. A maintainer should re-run this from a branch in this repository before trusting it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the integration-test label
        if: ${{ github.event_name == 'pull_request' && steps.gate.outputs.skip != 'true' && !contains(github.event.pull_request.labels.*.name, 'integration-test') }}
        run: |
          echo "::error::Integration tests have not run. Add the 'integration-test' label to this PR."
          exit 1
      - uses: actions/checkout@v7
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          submodules: recursive
      # libssl-dev is required here: without OpenSSL the build supports only
      # http:// endpoints and this test uses https://.
      - if: ${{ steps.gate.outputs.skip != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libicu-dev nlohmann-json3-dev libsqlite3-dev libssl-dev sqlite3
      - if: ${{ steps.gate.outputs.skip != 'true' }}
        run: make loadable
      - name: Decision checks against the remote endpoint
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          DQ_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$DQ_API_KEY" ]; then
            echo "::error::TYPESAFE_API_KEY is empty. Set it with: gh secret set TYPESAFE_API_KEY"
            exit 1
          fi
          python3 .github/scripts/integration_test.py \
            --extension dist/debug/decision_query \
            --backend https://api.typesafe.ai/v1/systemone \
            --profile jev
